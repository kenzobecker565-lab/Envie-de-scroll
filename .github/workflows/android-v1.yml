name: APK V1 Android
on:
  pull_request:
    paths: ['android/**', '.github/workflows/android-v1.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Installer le SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Construire et vérifier
        working-directory: android
        run: gradle :app:assembleRelease :app:lintRelease --no-daemon
      - name: Préparer les fichiers
        run: |
          mkdir -p apk-output
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c 4 android/app/build/outputs/apk/release/app-release-unsigned.apk
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk apk-output/Scroll-up-V1-unsigned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" apk-output/
          cp android/app/build/reports/lint-results-release.html apk-output/
      - uses: actions/upload-artifact@v4
        with:
          name: Scroll-up-V1-Android-build
          path: apk-output/
          retention-days: 30
