# Vérifications automatiques lancées par GitHub à chaque pull request et à
# chaque mise à jour de la branche principale : tests (dont la couverture de
# la bibliothèque d'activités), typage TypeScript et construction de l'app.
name: Vérifications

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verifier:
    name: Tests et build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
