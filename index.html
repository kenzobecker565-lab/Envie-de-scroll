<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FBF5EC" />
    <meta name="description" content="Transforme chaque envie de scroller en un petit moment créatif lié à tes passions." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Plutôt Que Scroller</title>
    <script>
      // Applique le thème (clair / sombre) avant l'affichage, pour éviter un flash blanc.
      // Même clé de stockage que src/services/preferences.ts.
      try {
        var saved = localStorage.getItem('pqs-theme')
        var dark = saved === 'dark' || (saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) {
          document.documentElement.classList.add('dark')
          document.documentElement.style.colorScheme = 'dark'
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#17120F')
        }
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
