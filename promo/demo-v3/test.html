<script type="module">
import * as THREE from 'three'
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js'
import { loadLibrary, makeActor } from './acteurs.js'
const W = 1080, H = 1920
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true })
r.setSize(W, H); r.toneMapping = THREE.NeutralToneMapping; r.shadowMap.enabled = true
document.body.append(r.domElement)
const scene = new THREE.Scene(); scene.background = new THREE.Color('#3a2a20')

const a = makeActor(lib, { body: 'male', hair: 'Hair_SimpleParted', hairColor: '#2b1d14', outfit: { robe: '#8c1a14' } })
a.g.position.set(-0.9, 0, 0); scene.add(a.g)
const b = makeActor(lib, { body: 'female', hair: 'Hair_Buns', hairColor: '#4a2c1a', outfit: { sweater: '#2f7a8a' } })
b.g.position.set(0.9, 0, 0); scene.add(b.g)
window.__shot = (t, mode) => {
  a.pose([{ clip: 'Idle_Talking_Loop', time: t }], { mouthOpen: 0.6 })
  b.pose([{ clip: 'Idle_Loop', time: t }], { mouthOpen: 0.3 })
  if (mode === 'face') { const p = a.bones.Head.getWorldPosition(new THREE.Vector3()); cam.position.set(p.x + 0.2, p.y + 0.1, p.z + 1.4); cam.lookAt(p.x, p.y + 0.05, p.z) }
  else { cam.position.set(0, 2.0, 9); cam.lookAt(0, 1.7, 0) }
  r.render(scene, cam)
  const hp = a.bones.Head.getWorldPosition(new THREE.Vector3()); const hs = a.bones.Head.getWorldScale(new THREE.Vector3())
  const bu = a.g.getObjectByName('bust'); const bb = bu ? new THREE.Box3().setFromObject(bu) : null
  return JSON.stringify({ bust: bb && [bb.min.toArray().map(v=>+v.toFixed(2)), bb.max.toArray().map(v=>+v.toFixed(2))], vis: bu && bu.visible, head: hp.toArray().map(v=>+v.toFixed(3)), headScale: hs.x.toFixed(4) })
}
