<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scroll-up · Envol</title>
    <link rel="stylesheet" href="../node_modules/@fontsource-variable/nunito/index.css" />
    <link rel="stylesheet" href="../node_modules/@fontsource-variable/nunito/wght-italic.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="frame">
      <div id="stage">
        <svg width="0" height="0" style="position: absolute">
          <defs>
            <filter id="mblur" x="-5%" y="-20%" width="110%" height="140%">
              <feGaussianBlur id="mblurNode" stdDeviation="0 0" />
            </filter>
          </defs>
        </svg>
        <div id="sky" class="layer"></div>
        <div id="stars" class="layer"></div>
        <div id="world" class="layer"></div>
        <div id="gloom" class="layer"></div>
        <div id="fall" class="layer"></div>
        <div id="hud" class="layer"></div>
        <div id="hero" class="layer"></div>
        <div id="phoneLayer" class="layer"></div>
        <div id="endLayer" class="layer"></div>
        <div id="fx" class="layer"></div>
      </div>
    </div>
    <div id="controls">
      <button id="play" type="button">Lecture</button>
      <input id="scrub" type="range" min="0" max="30" step="0.001" value="0" />
      <span id="clock">0,00 s</span>
    </div>
    <script type="module" src="main.js"></script>
  </body>
</html>
