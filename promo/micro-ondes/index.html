<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Pourquoi ça chauffe ? Le micro-ondes</title>
    <link rel="stylesheet" href="../../node_modules/@fontsource-variable/figtree/index.css" />
    <link rel="stylesheet" href="style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "../node_modules/three/build/three.module.js",
          "three/addons/": "../node_modules/three/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="frame">
      <div id="stage">
        <div id="bg" class="layer"></div>
        <canvas id="gl" width="1080" height="1920"></canvas>
        <div id="labels" class="layer"></div>
        <div id="captions" class="layer"></div>
        <div id="wipes" class="layer"></div>
      </div>
    </div>
    <div id="controls">
      <button id="play" type="button">Lecture</button>
      <input id="scrub" type="range" min="0" max="90" step="0.001" value="0" />
      <span id="clock">0,00 s</span>
    </div>
    <script type="module" src="main.js"></script>
  </body>
