<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Plutôt Que Scroller · la pub</title>
    <link rel="stylesheet" href="../../node_modules/@fontsource-variable/fraunces/full.css" />
    <link rel="stylesheet" href="../../node_modules/@fontsource-variable/figtree/index.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="frame">
      <div id="stage">
        <svg width="0" height="0" style="position: absolute">
          <defs>
            <filter id="vblur" x="-5%" y="-10%" width="110%" height="120%"><feGaussianBlur id="vblurNode" stdDeviation="0 0" /></filter>
            <filter id="hblur" x="-10%" y="-5%" width="120%" height="110%"><feGaussianBlur id="hblurNode" stdDeviation="0 0" /></filter>
          </defs>
        </svg>
        <div id="cam" class="layer">
          <section id="s1" class="layer"></section>
          <section id="s2" class="layer"></section>
          <section id="s3" class="layer"></section>
          <section id="s4" class="layer"></section>
          <section id="s5" class="layer"></section>
          <section id="s6" class="layer"></section>
          <section id="s7" class="layer"></section>
        </div>
        <div id="captions" class="layer"></div>
        <div id="fx" class="layer"></div>
      </div>
    </div>
    <div id="controls">
      <button id="play" type="button">Lecture</button>
      <input id="scrub" type="range" min="0" max="28" step="0.001" value="0" />
      <span id="clock">0,00 s</span>
    </div>
    <script type="module" src="main.js"></script>
  </body>
</html>
