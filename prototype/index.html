<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F5F4F1" />
    <meta name="description" content="Transforme chaque envie de scroller en un petit moment créatif lié à tes passions." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Installation sur l'écran d'accueil du téléphone (« Ajouter à l'écran d'accueil ») -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Plutôt Que Scroller" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Plutôt Que Scroller</title>
    <script>
      // Langue de la page (utile quand l'app est intégrée dans une page hôte sans « lang »).
      if (!document.documentElement.lang) document.documentElement.lang = 'fr'
      // Applique le thème (clair / sombre) avant l'affichage, pour éviter un flash blanc.
      // Même clé de stockage que src/services/preferences.ts.
      try {
        var saved = null
        try { saved = localStorage.getItem('pqs-theme') } catch (error) {}
        var host = document.documentElement.getAttribute('data-theme')
        var automatic = host === 'dark' || (host !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        var dark = saved === 'dark' || (saved !== 'light' && automatic)
        if (dark) {
          document.documentElement.classList.add('dark')
          document.documentElement.style.colorScheme = 'dark'
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#141311')
        }
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
